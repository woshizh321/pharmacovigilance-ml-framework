name: release-boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundary-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit repository disclosure boundary
        run: python tools/check_release.py
      - name: Parse Python sources
        run: python -m compileall -q scripts tools
